<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Make an enquiry about Frozen Trust ice products and services.">

    <title>Enquiry | Frozen Trust</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo-area">

        <img src="images/frozen-trust-logo.png"
             alt="Frozen Trust logo"
             class="logo">

        <div>

            <h1>Frozen Trust</h1>

            <p>Trusted Supply</p>

        </div>

    </div>


    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="products.html">Products</a></li>

            <li><a href="services.html">Services</a></li>

            <li><a href="enquiry.html">Enquiry</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>


<main>

    <section class="section">

        <h2>Make an Enquiry</h2>

        <p>
            Complete the form below to enquire about our
            products and services.
        </p>


        <form action="mailto:mtshwenimakaziwe1@gmail.com"
              method="post"
              enctype="text/plain">


            <label for="name">
                Full Name
            </label>

            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name">


            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address">


            <label for="phone">
                Phone Number
            </label>

            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your phone number">


            <label for="product">
                Product/Service
            </label>

            <select id="product"
                    name="product">

                <option value="">
                    Select an option
                </option>

                <option value="2kg Ice">
                    2kg Ice
                </option>

                <option value="3kg Ice">
                    3kg Ice
                </option>

                <option value="Bulk Order">
                    Bulk Order
                </option>

                <option value="Freezer Rental">
                    Freezer Rental
                </option>

            </select>


            <label for="message">
                Message
            </label>

            <textarea id="message"
                      name="message"
                      placeholder="Write your enquiry here"></textarea>


            <button type="submit"
                    class="button">

                Submit Enquiry

            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Frozen Trust. All Rights Reserved.
    </p>

</footer>


</body>

</html>
